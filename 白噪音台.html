</nav>
  <script src="hub-nav.js?v=5"></script>

  <div id="ambient-bg" aria-hidden="true"></div>

  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🎧</span>
        <div>
          <h1>白噪音台</h1>
          <p>几种声音 · 慢慢叠</p>
        </div>
      </div>
      <button type="button" id="play-btn">▶ 播放</button>
    </header>

    <main id="main">
      <p class="hint">先点场景一键混音 · 或自己勾选单轨叠在一起</p>
      <div id="status-line"></div>
      <p class="section-label">🎬 场景（一键混好几种）</p>
      <div id="scene-row" class="scene-row"></div>
      <p class="section-label">🎚 单轨（共 15 种）</p>
      <div id="cat-row" class="cat-row"></div>
      <div id="sound-grid" class="sound-grid"></div>

      <div class="panel">
        <h2>🔊 总音量</h2>
        <div class="row">
          <label for="master-vol">主音量</label>
          <input type="range" id="master-vol" min="0" max="100" value="70">
        </div>
      </div>

      <div class="panel">
        <h2>⏱ 定时关闭</h2>
        <div class="timer-chips">
          <button type="button" class="timer-chip active" data-min="0">不限</button>
          <button type="button" class="timer-chip" data-min="15">15 分</button>
          <button type="button" class="timer-chip" data-min="30">30 分</button>
          <button type="button" class="timer-chip" data-min="45">45 分</button>
          <button type="button" class="timer-chip" data-min="60">60 分</button>
        </div>
        <div id="timer-left"></div>
      </div>
    </main>
  </div>

  <script src="noise-app/app.js?v=4"></script>
</body>
