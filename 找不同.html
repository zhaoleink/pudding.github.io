  <script src="hub-nav.js?v=5"></script>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🔍</span>
        <div>
          <h1>找不同</h1>
          <p>慢慢对 · 无计时</p>
        </div>
      </div>
      <div id="topbar-actions">
        找齐<br><strong id="stat-done">0</strong> 组
      </div>
    </header>

    <div id="tip-banner">
      <p id="tip-speech">上下两图 almost 一样……找出不一样的地方，点一下。</p>
    </div>

    <section id="level-picker">
      <div class="picker-head">
        <h2>📍 选一组图</h2>
        <button type="button" id="btn-toggle-picker">收起 / 展开</button>
      </div>
      <div id="level-chips"></div>
    </section>

    <section id="play-area">
      <div id="scene-head">
        <span id="scene-title">花鱼小院</span>
        <span id="scene-progress">0 / 5</span>
      </div>
      <div id="panels-wrap">
        <div id="panels">
          <div class="panel-row">
            <span class="panel-label">上图</span>
            <canvas id="canvas-left" class="diff-canvas" aria-label="上图"></canvas>
          </div>
          <div class="panel-row">
            <span class="panel-label">下图</span>
            <canvas id="canvas-right" class="diff-canvas" aria-label="下图"></canvas>
          </div>
        </div>
        <div id="marker-layer" aria-hidden="true"></div>
        <div id="complete-overlay">
          <span class="big">🎉</span>
          <p>这一组全部找齐啦！</p>
          <button type="button" id="btn-next">继续</button>
        </div>
      </div>
    </section>

    <div id="toolbar">
      <button type="button" class="tool-btn" id="btn-hint">
        <span class="ico">👀</span>
        提示 (<span id="stat-hints">3</span>)
      </button>
      <button type="button" class="tool-btn" id="btn-reset">
        <span class="ico">↺</span>
        重找这一组
      </button>
    </div>

    <p class="foot-note">
      累计找到 <strong id="stat-found">0</strong> 处不同 · 点任意一张图里<strong>不一样</strong>的位置 · 没有倒计时
    </p>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="diff-game/art.js"></script>
  <script src="diff-game/game.js?v=2"></script>
</body>
