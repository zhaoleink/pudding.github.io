<!DOCTYPE html>
<html lang="zh-CN" data-page="全球矿石地图.html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全球矿石地图 · 示意矿带</title>
  <link rel="stylesheet" href="hub-nav.css?v=5">
  <link rel="stylesheet" href="ore-globe/style.css?v=4">
  <script src="anti-ad-shield.js"></script>
</head>
<body>
  <nav class="hub-nav" aria-label="应用导航">
    <span class="hub-label">去 →</span>
    <a href="游戏大厅.html">大厅</a>
    <a href="造语坊.html" class="hub-lang">造语坊</a>
    <a href="白噪音台.html">白噪音</a>
    <a href="全球矿石地图.html">矿石地图</a>
    <a href="小蛇吃豆.html">小蛇吃豆</a>
    <a href="bubble-game.html">解压气泡</a>
  </nav>
  <script src="hub-nav.js?v=5"></script>

  <div id="app">
    <header id="ore-topbar">
      <h1>🌍 全球矿石分布</h1>
      <p class="sub">元素与矿物示意 · 不含气体 / 剧毒重金属 / 放射性 · 右侧下滑查看更多</p>
      <div id="ore-stats">加载中…</div>
      <div id="ore-filters" aria-label="矿物筛选"></div>
    </header>
    <div id="ore-body">
      <div id="ore-stage">
        <canvas id="ore-canvas" tabindex="0" aria-label="可旋转地球与矿点"></canvas>
        <div id="ore-detail" aria-live="polite"></div>
        <p id="ore-hint">拖动旋转 · 方向键或 WASD · 轻点矿物</p>
        <div id="ore-loading" aria-busy="true" aria-live="polite">
          <canvas id="ore-loading-stars" aria-hidden="true"></canvas>
          <div class="ore-loading-inner">
            <div class="ore-loading-moon" aria-hidden="true"></div>
            <p class="ore-loading-title">夜空矿图</p>
            <p class="ore-loading-msg" id="ore-loading-msg">正在布置矿带…</p>
            <div class="ore-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
      <aside id="ore-legend" aria-label="矿物名称">
        <p class="ore-legend-title">矿物</p>
        <ul id="ore-legend-list"></ul>
      </aside>
    </div>
  </div>

  <script src="ore-globe/loading-boot.js?v=1"></script>
  <script src="hub-keyboard.js?v=1"></script>
  <script src="ore-globe/canvas-globe.js?v=9"></script>
</body>
</html>
