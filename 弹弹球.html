  <script src="hub-nav.js?v=5"></script>

  <div id="app">
    <header id="marble-hud">
      <h1>弹弹球</h1>
      <p class="hint" id="marble-hint">台面撞彩珠得合成币 · 点「合成台」在格子里合成</p>
      <div id="marble-stats">
        <span>合成币 <b id="stat-coins">0</b><small id="coin-progress">/100</small></span>
        <span>碰撞 <b id="stat-hits">0</b></span>
        <span>紫球 <b id="stat-purples">0</b></span>
      </div>
      <button type="button" id="btn-craft">合成台</button>
      <button type="button" id="btn-reset">重摆</button>
    </header>
    <div id="marble-stage">
      <canvas id="marble-canvas" aria-label="弹弹球台面"></canvas>
      <p id="merge-toast" hidden aria-live="polite"></p>
    </div>
  </div>

  <div id="craft-overlay" class="craft-overlay" hidden>
    <div class="craft-panel" role="dialog" aria-labelledby="craft-title" aria-modal="true">
      <header class="craft-head">
        <h2 id="craft-title">合成台</h2>
        <p class="craft-sub">6 行 × 16 格 · 满 100 合成币自动放入粉球 · 粉+粉→蓝 · 蓝+蓝→紫</p>
        <div class="craft-meta">
          <span>合成币 <b id="craft-coins">0</b>/100</span>
          <button type="button" id="btn-claim-pink">领一颗粉球 (−100)</button>
          <button type="button" id="btn-craft-close">收起</button>
        </div>
      </header>
      <div id="craft-grid" class="craft-grid" aria-label="合成格子"></div>
    </div>
  </div>

  <script src="marble-game/game.js?v=12"></script>
  <script src="marble-game/craft-grid.js?v=12"></script>
</body>
</html>
