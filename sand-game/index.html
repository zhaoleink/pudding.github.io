  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🏜</span>
        <div>
          <h1>静沙</h1>
          <p>轻沙声 · 慢慢耙</p>
        </div>
      </div>
      <div id="topbar-actions">
        <span id="silent-badge" title="只有很轻的沙声">🎵 轻沙声</span>
        <div id="stats">
          累计耙过<br><strong id="stat-raked">0</strong> 尺
        </div>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="sand-canvas"></canvas>
      <div id="template-progress" hidden></div>
      <div id="template-picker" class="template-picker" hidden aria-label="选择跟划模版"></div>
      <div id="hint">按住拖动 · 像耙沙子一样划开纹路</div>
    </div>

    <div id="toolbar">
      <button type="button" class="tool-btn active" data-tool="narrow">
        <span class="ico">〰️</span>细耙
      </button>
      <button type="button" class="tool-btn" data-tool="wide">
        <span class="wide-normal" id="wide-normal">
          <span class="ico">≡</span>宽耙
        </span>
        <span class="wide-cooldown-face" id="wide-cooldown-face" hidden></span>
        <span class="tool-cd" id="wide-cd"></span>
      </button>
      <button type="button" class="tool-btn" data-tool="wave">
        <span class="ico">🌊</span>波纹
      </button>
      <button type="button" class="tool-btn" data-tool="stone">
        <span class="ico">🪨</span>石头
      </button>
      <button type="button" class="tool-btn" data-tool="smooth">
        <span class="ico">🌬</span>抚平
      </button>
      <button type="button" class="tool-btn" id="btn-template">
        <span class="ico">📐</span>跟划
      </button>
    </div>
  </div>

  <script src="game.js?v=14"></script>
